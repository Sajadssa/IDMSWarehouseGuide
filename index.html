<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>راهنمای کاربری IDMS Warehouse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#060810;
  --bg-1:#0a0f1a;
  --bg-2:#0e1521;
  --bg-3:#121a28;
  --border:rgba(255,255,255,.08);
  --border-strong:rgba(255,255,255,.14);
  --hi:#eef2f6;
  --mid:#b7c0cd;
  --lo:#7c8798;
  --accent:#2ecf9f;
  --accent-strong:#43e6b3;
  --accent-dim:rgba(46,207,159,.12);
  --accent-line:rgba(46,207,159,.32);
  --warn:#eab308;
  --warn-dim:rgba(234,179,8,.10);
  --danger:#f87171;
  --danger-dim:rgba(248,113,113,.10);
  --sans:'Vazirmatn',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --radius:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans);
  background:
    radial-gradient(1100px 700px at 88% -8%, rgba(46,207,159,.10), transparent 60%),
    radial-gradient(900px 600px at -10% 108%, rgba(56,90,255,.08), transparent 60%),
    var(--bg-0);
  color:var(--hi);
  min-height:100vh;
  overflow-x:hidden;
}
.shell{max-width:1180px;margin:0 auto;padding:22px 26px 0;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:18px;border-bottom:1px solid var(--border);}
.topbar .crumb{display:flex;align-items:center;gap:10px;color:var(--lo);font-size:13px;}
.crumb .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);}
.topbar .hint{color:var(--lo);font-size:12px;display:flex;align-items:center;gap:6px;}
.topbar .hint kbd{font-family:var(--mono);background:var(--bg-2);border:1px solid var(--border-strong);border-radius:6px;padding:2px 7px;font-size:11px;color:var(--mid);}
.layout{display:flex;direction:ltr;gap:0;align-items:flex-start;padding:26px 0 30px;}
.content{flex:1;min-width:0;direction:rtl;padding-left:34px;}
.sidebar{width:266px;flex:none;direction:rtl;position:sticky;top:22px;}
.brand-kicker{font-size:11px;letter-spacing:.14em;color:var(--lo);text-transform:uppercase;margin-bottom:10px;}
.brand-title{font-size:22px;font-weight:800;color:var(--hi);margin:0 0 4px;}
.brand-sub{font-size:12.5px;color:var(--lo);margin-bottom:20px;}
.navlist{display:flex;flex-direction:column;gap:3px;}
.navitem{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;cursor:pointer;transition:background .15s;}
.navitem:hover{background:var(--bg-2);}
.navitem.active{background:linear-gradient(180deg, rgba(46,207,159,.16), rgba(46,207,159,.07));border:1px solid var(--accent-line);}
.navitem .num{font-family:var(--mono);font-size:11px;color:var(--lo);width:22px;flex:none;}
.navitem.active .num{color:var(--accent-strong);}
.navitem .labels{min-width:0;}
.navitem .t{font-size:13.5px;font-weight:600;color:var(--mid);}
.navitem.active .t{color:var(--hi);}
.navitem .s{font-size:11px;color:var(--lo);opacity:.85;margin-top:1px;}

.page{display:none;}
.page.active{display:block;animation:fadein .35s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.chapter-badge{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--accent-strong);background:var(--accent-dim);border:1px solid var(--accent-line);border-radius:999px;padding:4px 12px;margin-bottom:16px;font-weight:600;}
h1.page-title{font-size:30px;line-height:1.35;font-weight:800;color:var(--hi);margin:0 0 14px;}
p.lead{font-size:15px;line-height:1.9;color:var(--mid);max-width:760px;margin:0 0 22px;}

/* generic cards */
.card{background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;}
.card + .card{margin-top:12px;}
.grid{display:grid;gap:12px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:1fr 1fr 1fr;}
@media (max-width:760px){.grid-2,.grid-3{grid-template-columns:1fr;}}

/* anatomy numbered list */
.anatomy{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 22px;}
@media (max-width:760px){.anatomy{grid-template-columns:1fr;}}
.anat-item{display:flex;gap:12px;background:var(--bg-1);border:1px solid var(--border);border-radius:14px;padding:13px 14px;}
.anat-item .badge{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent-dim);border:1px solid var(--accent-line);color:var(--accent-strong);font-family:var(--mono);font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:700;}
.anat-item .txt b{color:var(--hi);font-size:13.5px;}
.anat-item .txt p{margin:3px 0 0;color:var(--lo);font-size:12.5px;line-height:1.7;}
.anat-item code, .card code, .cmp code, .step-panel code{font-family:var(--mono);background:var(--bg-2);border:1px solid var(--border-strong);border-radius:6px;padding:1px 6px;font-size:11.5px;color:var(--accent-strong);}

/* equation row */
.equation{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:20px 0 22px;}
.eq-box{background:var(--bg-1);border:1px solid var(--border-strong);border-radius:14px;padding:14px 18px;text-align:center;min-width:150px;}
.eq-box .num{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--accent-strong);}
.eq-box.final .num{color:var(--hi);font-size:24px;}
.eq-box .cap{font-size:11px;color:var(--lo);margin-top:6px;}
.eq-op{font-size:20px;color:var(--lo);font-weight:700;}

table.tbl{width:100%;border-collapse:collapse;font-size:13px;margin:14px 0 22px;}
table.tbl th{text-align:right;color:var(--lo);font-weight:600;font-size:11.5px;padding:8px 12px;border-bottom:1px solid var(--border-strong);white-space:nowrap;}
table.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--mid);vertical-align:top;line-height:1.7;}
table.tbl tr:last-child td{border-bottom:none;}
table.tbl td b{color:var(--hi);}

.dual{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 22px;}
@media (max-width:760px){.dual{grid-template-columns:1fr;}}
.dual .box{border-radius:14px;padding:14px 16px;border:1px solid var(--border);}
.dual .box.tech{background:linear-gradient(180deg, rgba(56,90,255,.07), transparent);}
.dual .box.simple{background:linear-gradient(180deg, rgba(46,207,159,.08), transparent);border-color:var(--accent-line);}
.dual .box .tag{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px;}
.dual .box.tech .tag{color:#8ea3ff;}
.dual .box.simple .tag{color:var(--accent-strong);}
.dual .box p{margin:0;font-size:13px;line-height:1.85;color:var(--mid);}

.rule-cards{display:flex;flex-direction:column;gap:10px;margin:16px 0 22px;}
.rule-card{display:flex;gap:12px;align-items:flex-start;background:var(--bg-1);border:1px solid var(--border-strong);border-radius:14px;padding:14px 16px;}
.rule-card .n{font-family:var(--mono);font-weight:800;color:var(--accent-strong);font-size:16px;flex:none;}
.rule-card p{margin:0;font-size:13.5px;color:var(--mid);line-height:1.8;}
.rule-card p b{color:var(--hi);}

.warn-card{background:var(--warn-dim);border:1px solid rgba(234,179,8,.35);border-radius:14px;padding:14px 16px;margin:14px 0;}
.warn-card .t{color:var(--warn);font-weight:700;font-size:13px;margin-bottom:4px;}
.warn-card p{margin:0;font-size:13px;color:var(--mid);line-height:1.8;}
.danger-card{background:var(--danger-dim);border:1px solid rgba(248,113,113,.35);border-radius:14px;padding:14px 16px;margin:14px 0;}
.danger-card .t{color:var(--danger);font-weight:700;font-size:13px;margin-bottom:4px;}
.danger-card p{margin:0;font-size:13px;color:var(--mid);line-height:1.8;}

.codeblock{font-family:var(--mono);background:#04070c;border:1px solid var(--border-strong);border-radius:12px;padding:14px 16px;font-size:12px;color:#9fe6c9;line-height:1.9;margin:10px 0;direction:ltr;text-align:left;overflow-x:auto;}
.codeblock .ln{color:#5b6b7c;}

/* roadmap stepper (static, intro) */
.roadmap{display:flex;flex-direction:column;gap:10px;margin:18px 0;}
.road-item{display:flex;align-items:center;gap:14px;background:var(--bg-1);border:1px solid var(--border);border-radius:14px;padding:14px 16px;}
.road-item .circ{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent-dim);border:1px solid var(--accent-line);color:var(--accent-strong);display:flex;align-items:center;justify-content:center;font-weight:800;font-family:var(--mono);}
.road-item .tt{font-size:14px;font-weight:700;color:var(--hi);}
.road-item .cc{font-family:var(--mono);font-size:11px;color:var(--lo);margin-top:2px;}

.cta-row{display:flex;gap:12px;margin:22px 0 26px;flex-wrap:wrap;}
.btn{border:none;border-radius:999px;padding:12px 22px;font-family:var(--sans);font-size:13.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .12s, opacity .12s;}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--accent);color:#04140f;}
.btn.primary:hover{background:var(--accent-strong);}
.btn.outline{background:transparent;border:1px solid var(--border-strong);color:var(--mid);}
.btn.outline:hover{border-color:var(--accent-line);color:var(--hi);}

.stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:6px;}
@media (max-width:760px){.stat-row{grid-template-columns:1fr;}}
.stat-chip{background:var(--bg-1);border:1px solid var(--border);border-radius:14px;padding:14px 16px;}
.stat-chip .big{color:var(--accent-strong);font-weight:800;font-size:15px;}
.stat-chip .small{color:var(--lo);font-size:12px;margin-top:4px;line-height:1.6;}

/* stepper component */
.stepper{margin:10px 0 24px;}
.step-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.step-tab{display:flex;align-items:center;gap:8px;background:var(--bg-1);border:1px solid var(--border);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:12.5px;color:var(--mid);transition:all .15s;}
.step-tab .c{font-family:var(--mono);width:20px;height:20px;border-radius:50%;background:var(--bg-3);color:var(--lo);display:flex;align-items:center;justify-content:center;font-size:11px;flex:none;}
.step-tab.active{background:var(--accent-dim);border-color:var(--accent-line);color:var(--hi);}
.step-tab.active .c{background:var(--accent);color:#04140f;}
.step-panel{background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;}
.step-panel h3{margin:0 0 10px;font-size:16px;color:var(--hi);}
.step-panel > p.desc{margin:0 0 14px;font-size:13.5px;color:var(--mid);line-height:1.85;}
.step-nav{display:flex;justify-content:space-between;margin-top:16px;}
.step-nav button{background:var(--bg-2);border:1px solid var(--border-strong);color:var(--mid);border-radius:999px;padding:7px 16px;font-size:12px;cursor:pointer;font-family:var(--sans);}
.step-nav button:hover{color:var(--hi);border-color:var(--accent-line);}
.step-nav button:disabled{opacity:.35;cursor:default;}

/* comparison "before/after" cards */
.cmp{display:flex;flex-direction:column;gap:8px;background:var(--bg-1);border:1px solid var(--border);border-radius:14px;padding:14px 16px;}
.cmp .row{display:flex;gap:10px;align-items:baseline;font-size:12.5px;}
.cmp .row .k{flex:none;width:52px;color:var(--lo);font-size:11px;font-weight:700;}
.cmp .row.old .k{color:var(--danger);}
.cmp .row.new .k{color:var(--accent-strong);}
.cmp .row p{margin:0;color:var(--mid);line-height:1.7;}
.cmp .ttl{font-size:13.5px;font-weight:700;color:var(--hi);margin-bottom:4px;}

/* accordion */
.acc-item{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg-1);}
.acc-head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;cursor:pointer;gap:10px;}
.acc-head .msg{font-family:var(--mono);font-size:12.5px;color:var(--warn);}
.acc-head .chev{color:var(--lo);font-size:12px;transition:transform .2s;flex:none;}
.acc-item.open .chev{transform:rotate(-90deg);}
.acc-body{max-height:0;overflow:hidden;transition:max-height .25s ease;}
.acc-item.open .acc-body{max-height:220px;}
.acc-body-inner{padding:0 16px 14px;font-size:13px;color:var(--mid);line-height:1.8;}

/* practice widget */
.practice-wrap{background:var(--bg-1);border:1px solid var(--border-strong);border-radius:20px;padding:24px;margin:10px 0 24px;}
.pf-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
@media (max-width:760px){.pf-row{grid-template-columns:1fr;}}
.pf-field label{display:block;font-size:11.5px;color:var(--lo);margin-bottom:6px;font-weight:600;}
.pf-field select, .pf-field input{width:100%;background:var(--bg-2);border:1px solid var(--border-strong);color:var(--hi);border-radius:10px;padding:10px 12px;font-family:var(--sans);font-size:13px;}
.pf-field select:focus, .pf-field input:focus{outline:none;border-color:var(--accent-line);}
.commodity-row{display:flex;align-items:center;gap:10px;}
.commodity-row input{max-width:110px;font-family:var(--mono);}
.ok-tag{font-size:12px;color:var(--accent-strong);font-weight:700;opacity:0;transition:opacity .2s;}
.ok-tag.show{opacity:1;}

.original-code-box{display:flex;align-items:center;gap:14px;background:linear-gradient(180deg, rgba(234,179,8,.10), transparent);border:1px solid rgba(234,179,8,.3);border-radius:14px;padding:14px 18px;margin:16px 0;}
.original-code-box .lbl{font-size:11px;color:var(--warn);font-weight:700;}
.original-code-box .val{font-family:var(--mono);font-size:22px;font-weight:800;color:#fde68a;letter-spacing:2px;}

.attr-table{width:100%;border-collapse:collapse;margin:10px 0;}
.attr-table th{font-size:11px;color:var(--lo);text-align:right;padding:6px 10px;border-bottom:1px solid var(--border-strong);}
.attr-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
.attr-table select{width:100%;background:var(--bg-2);border:1px solid var(--border-strong);color:var(--hi);border-radius:8px;padding:7px 9px;font-size:12.5px;font-family:var(--sans);}
.attr-table .digit{font-family:var(--mono);color:var(--accent-strong);font-weight:700;text-align:center;}
.attr-table input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);}
.attr-table td.attn{color:var(--hi);font-size:13px;font-weight:600;}

.final-code-box{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;background:linear-gradient(180deg, rgba(46,207,159,.14), transparent);border:1px solid var(--accent-line);border-radius:16px;padding:18px 22px;margin:18px 0;}
.final-code-box .lbl{font-size:11px;color:var(--accent-strong);font-weight:700;letter-spacing:.05em;}
.final-code-box .val{font-family:var(--mono);font-size:28px;font-weight:800;color:var(--hi);letter-spacing:3px;}
.final-code-box .val .p1{color:var(--hi);}
.final-code-box .val .p2{color:var(--accent-strong);}
.save-btn-row{display:flex;justify-content:flex-end;}
.toast{margin-top:10px;font-size:12.5px;padding:10px 14px;border-radius:10px;display:none;}
.toast.err{background:var(--danger-dim);border:1px solid rgba(248,113,113,.35);color:#fca5a5;display:block;}
.toast.ok{background:var(--accent-dim);border:1px solid var(--accent-line);color:var(--accent-strong);display:block;}

.shot-wrap{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--border-strong);box-shadow:0 24px 60px -24px rgba(46,207,159,.18);margin:18px 0 20px;background:#e9edf1;}
.shot-wrap img{display:block;width:100%;height:auto;}
.shot-cap{background:var(--bg-1);border-top:1px solid var(--border);padding:9px 16px;font-size:12px;color:var(--lo);display:flex;align-items:center;gap:8px;}
.shot-cap b{color:var(--mid);}
.shot-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--accent-strong);background:var(--accent-dim);border:1px solid var(--accent-line);border-radius:999px;padding:3px 10px;font-weight:700;margin-bottom:10px;}
.real-example{background:linear-gradient(180deg, rgba(46,207,159,.09), transparent);border:1px solid var(--accent-line);border-radius:14px;padding:14px 16px;margin:12px 0 20px;}
.real-example .t{color:var(--accent-strong);font-weight:700;font-size:12.5px;margin-bottom:6px;}
.real-example p{margin:0;color:var(--mid);font-size:13px;line-height:1.85;}

/* footer nav */
.footer{position:sticky;bottom:0;background:linear-gradient(180deg, transparent, var(--bg-0) 30%);padding:14px 0 22px;margin-top:10px;}
.footer-bar{max-width:1180px;margin:0 auto;padding:0 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.dots{display:flex;gap:6px;}
.dots .d{width:7px;height:7px;border-radius:50%;background:var(--border-strong);cursor:pointer;transition:all .2s;}
.dots .d.active{width:22px;border-radius:4px;background:var(--accent);}
.foot-btn{border:none;border-radius:999px;padding:10px 20px;font-family:var(--sans);font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;}
.foot-btn.next{background:var(--accent);color:#04140f;}
.foot-btn.prev{background:transparent;color:var(--lo);border:1px solid var(--border-strong);}
.foot-btn:disabled{opacity:.3;cursor:default;}
.foot-btn .lbl-sub{opacity:.75;font-weight:500;}

@media (max-width:900px){
  .layout{flex-direction:column;}
  .sidebar{width:100%;position:relative;order:-1;margin-bottom:18px;}
  .navlist{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px;}
  .navitem{flex:none;}
  .content{padding-left:0;}
}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="crumb"><span class="dot"></span><span id="crumbText">این نرم‌افزار چیست و این راهنما چطور کار می‌کند</span></div>
    <div class="hint">کلیدهای <kbd>←</kbd><kbd>→</kbd> برای ورق زدن فصل‌ها</div>
  </div>

  <div class="layout">
    <div class="content" id="content"><!-- pages injected --></div>
    <div class="sidebar">
      <div class="brand-kicker">PEDC · WAREHOUSE</div>
      <div class="brand-title">راهنمای IDMS</div>
      <div class="brand-sub">ثبت کالا · UNSPSC · کد نهایی</div>
      <div class="navlist" id="navlist"></div>
    </div>
  </div>
</div>

<div class="footer">
  <div class="footer-bar">
    <button class="foot-btn prev" id="prevBtn">→ <span id="prevLabel">قبلی</span></button>
    <div class="dots" id="dots"></div>
    <button class="foot-btn next" id="nextBtn"><span id="nextLabel">بعدی</span> ←</button>
  </div>
</div>

<script>
/* ================= DATA ================= */
const CHAPTERS = [
  {n:"۰۰", t:"شروع", s:"این نرم‌افزار چیست و این راهنما چطور کار می‌کند"},
  {n:"۰۱", t:"کد نهایی", s:"کد ۱۳ رقمی از چه ساخته می‌شود"},
  {n:"۰۲", t:"سه فرم", s:"ترتیب کار و دو قاعده طلایی"},
  {n:"۰۳", t:"تازه‌ها", s:"چه چیزی در این ویرایش عوض شد"},
  {n:"۰۴", t:"کالای پایه", s:"فرم frmBaseMaterialEntry"},
  {n:"۰۵", t:"خانواده UNSPSC", s:"فرم frmUNSPSCEntry و به‌روزرسانی آبشاری"},
  {n:"۰۶", t:"کد نهایی کاتالوگ", s:"فرم frmBuildMaterial و پنج ویژگی"},
  {n:"۰۷", t:"ویرایش و چاپ", s:"Edit، Delete، Print"},
  {n:"۰۸", t:"خطاها و دکمه‌ها", s:"پیام‌های رایج نرم‌افزار و مرجع سریع"},
  {n:"۰۹", t:"تمرین زنده", s:"یک کد را همین‌جا بسازید تا منطق کار جا بیفتد"},
];

// Real UNSPSC family/class samples read directly from IDMS_Warehouse.accdb (tbl_UNSPSC_Families)
const UNSPSC_DATA = {
  "3116": {label:"3116 · HARDWARE", classes:[
    {code:"311615",desc:"SCREWS",fa:"پیچ"},

function anatomy(items){
  return `<div class="anatomy">${items.map(([n,t,d])=>`
    <div class="anat-item"><div class="badge">${n}</div><div class="txt"><b>${t}</b><p>${d}</p></div></div>`).join('')}</div>`;
}
function dual(techHtml, simpleHtml){
  return `<div class="dual">
    <div class="box tech"><div class="tag">نکتهٔ فنی</div><p>${techHtml}</p></div>
    <div class="box simple"><div class="tag">برای مبتدی</div><p>${simpleHtml}</p></div>
  </div>`;
}
function tbl(headers, rows){
  return `<table class="tbl"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
  <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
let stepperSeq = 0;
function stepper(steps){
  const id = 'stp'+(stepperSeq++);
  window.__steppers = window.__steppers||{};
  window.__steppers[id] = {steps, cur:0};
  return `<div class="stepper" id="${id}">
    <div class="step-tabs">${steps.map((s,i)=>`
      <div class="step-tab ${i===0?'active':''}" onclick="setStep('${id}',${i})"><span class="c">${i+1}</span>${s.tab}</div>`).join('')}</div>
    <div class="step-panel" id="${id}-panel"></div>
  </div>`;
}
window.setStep = function(id, i){
  window.__steppers[id].cur = i;
  renderStepDom(id);
}
window.renderStep = function(id){ renderStepDom(id); }
function renderStepDom(id){
  const st = window.__steppers[id];
  const root = document.getElementById(id);
  if(!root) return;
  root.querySelectorAll('.step-tab').forEach((el,i)=>el.classList.toggle('active', i===st.cur));
  const s = st.steps[st.cur];
  const panel = document.getElementById(id+'-panel');
  panel.innerHTML = `<h3>${s.title}</h3><p class="desc">${s.desc}</p>${s.dual?dual(s.dual[0], s.dual[1]):''}${s.extra||''}
    <div class="step-nav">
      <button onclick="stepMove('${id}',-1)" ${st.cur===0?'disabled':''}>← قبلی</button>
      <button onclick="stepMove('${id}',1)" ${st.cur===st.steps.length-1?'disabled':''}>بعدی →</button>
    </div>`;
}
window.stepMove = function(id, d){
  const st = window.__steppers[id];
  st.cur = Math.max(0, Math.min(st.steps.length-1, st.cur+d));
  renderStepDom(id);
}

let accSeq = 0;
function accordion(items){
  return `<div>${items.map(([msg,body])=>{
    const id = 'acc'+(accSeq++);
    return `<div class="acc-item" id="${id}">
      <div class="acc-head" onclick="document.getElementById('${id}').classList.toggle('open')">
        <span class="msg">${msg}</span><span class="chev">◀</span>
      </div>
      <div class="acc-body"><div class="acc-body-inner">${body}</div></div>
    </div>`;
  }).join('')}</div>`;
}

/* ================= PRACTICE WIDGET LOGIC ================= */
function initPractice(){
  const fSel = document.getElementById('pFamily');
  if(!fSel) return;
  fSel.innerHTML = Object.keys(UNSPSC_DATA).map(fc=>`<option value="${fc}">${UNSPSC_DATA[fc].label}</option>`).join('');
  onFamilyChange();
  const tbody = document.getElementById('pAttrTable');
  tbody.innerHTML = `<tr><th>Attribute</th><th>Value</th><th>Code Digit</th><th>Use</th></tr>` +
    ATTR_DEFS.map((a,i)=>`
      <tr>
        <td class="attn">${a.name}</td>
        <td><select id="pAttrVal${i}" onchange="recalc()">${a.options.map((o,oi)=>`<option value="${oi}">${o}</option>`).join('')}</select></td>
        <td class="digit" id="pAttrDigit${i}">0</td>
        <td><input type="checkbox" id="pAttrUse${i}" checked onchange="recalc()"></td>
      </tr>`).join('');
  recalc();
}
function onFamilyChange(){
  const fc = document.getElementById('pFamily').value;
  const cSel = document.getElementById('pClass');
  cSel.innerHTML = UNSPSC_DATA[fc].classes.map(c=>`<option value="${c.code}">${c.code} · ${c.fa} (${c.desc})</option>`).join('');
  recalc();
}
function recalc(){
  const cls = document.getElementById('pClass').value || '000000';
  const commodityEl = document.getElementById('pCommodity');
  let commodity = commodityEl.value.replace(/[^0-9]/g,'').slice(0,2);
  commodityEl.value = commodity;
  const okTag = document.getElementById('pOkTag');
  const complete = commodity.length===2;
  okTag.classList.toggle('show', complete);
  const original = complete ? (cls+commodity) : (cls + commodity.padEnd(2,'—'));
  document.getElementById('pOriginal').textContent = original;

  let digits = '';
  for(let i=0;i<ATTR_DEFS.length;i++){
    const valSel = document.getElementById('pAttrVal'+i);
    const digitEl = document.getElementById('pAttrDigit'+i);
    if(!valSel) return;
    const d = valSel.value;
    digitEl.textContent = d;
    digits += d;
  }
  const finalEl = document.getElementById('pFinal');
  if(complete){
    finalEl.innerHTML = `<span class="p1">${original}</span><span class="p2">${digits}</span>`;
  }else{
    finalEl.innerHTML = `<span class="p1">${cls}--</span><span class="p2">-----</span>`;
  }
}
function doSave(){
  const toast = document.getElementById('pToast');
  const commodity = document.getElementById('pCommodity').value;
  const name = document.getElementById('pName').value.trim();
  let allUsed = true;
  for(let i=0;i<ATTR_DEFS.length;i++){
    if(!document.getElementById('pAttrUse'+i).checked) allUsed=false;
  }
  if(commodity.length!==2){
    toast.className='toast err'; toast.textContent='Original Code must be exactly 8 digits — دو رقم Commodity را کامل کنید.'; return;
  }
  if(!name){
    toast.className='toast err'; toast.textContent='Cannot save. Still missing… — نام کالا (Material Name) را وارد کنید.'; return;
  }
  if(!allUsed){
    toast.className='toast err'; toast.textContent='All five attribute codes must be ticked — همهٔ پنج ردیف را تیک بزنید.'; return;
  }
  toast.className='toast ok'; toast.textContent='ثبت شد! رکورد به‌صورت آزمایشی در جدول Saved Records همین صفحه ظاهر می‌شد (این فقط تمرین است، چیزی در Access ذخیره نشد).';
}

/* ================= NAV ENGINE ================= */
let current = 0;
function buildNav(){
  const nl = document.getElementById('navlist');
  nl.innerHTML = CHAPTERS.map((c,i)=>`
    <div class="navitem" data-i="${i}" onclick="goTo(${i})">
      <div class="num">${c.n}</div>
      <div class="labels"><div class="t">${c.t}</div><div class="s">${c.s}</div></div>
    </div>`).join('');
  const dots = document.getElementById('dots');
  dots.innerHTML = CHAPTERS.map((c,i)=>`<div class="d" data-i="${i}" onclick="goTo(${i})"></div>`).join('');
}
function render(){
  const content = document.getElementById('content');
  stepperSeq = 0; accSeq = 0; window.__steppers = {};
  content.innerHTML = PAGES.map((fn,i)=>`<div class="page ${i===current?'active':''}" data-i="${i}">${fn()}</div>`).join('');
  Object.keys(window.__steppers).forEach(id=>renderStepDom(id));
  document.querySelectorAll('.navitem').forEach(el=>el.classList.toggle('active', +el.dataset.i===current));
  document.querySelectorAll('.dots .d').forEach(el=>el.classList.toggle('active', +el.dataset.i===current));
  document.getElementById('crumbText').textContent = CHAPTERS[current].s;
  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').disabled = current===CHAPTERS.length-1;
  document.getElementById('prevLabel').textContent = current===0 ? 'قبلی' : CHAPTERS[current-1].t;
  document.getElementById('nextLabel').textContent = current===CHAPTERS.length-1 ? 'بعدی' : CHAPTERS[current+1].t;
  window.scrollTo({top:0, behavior:'instant'});
  if(current===9) initPractice();
}
window.goTo = function(i){
  current = Math.max(0, Math.min(CHAPTERS.length-1, i));
  render();
}
document.getElementById('prevBtn').addEventListener('click', ()=>goTo(current-1));
document.getElementById('nextBtn').addEventListener('click', ()=>goTo(current+1));
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowLeft') goTo(current+1);
  if(e.key==='ArrowRight') goTo(current-1);
});

buildNav();
render();
</script>
